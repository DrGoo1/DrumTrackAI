[workspace]
members = [
    "audio-core",
]
exclude = [
    "tracktion-hybrid/rust/audio-core-ffi",
    "rust-core",
    "rust-audio",
    "rust-wasm",
    "rust-python"
]
resolver = "2"

[workspace.dependencies]
# Audio processing
cpal = "0.15"
hound = "3.5"
rubato = "0.15"
realfft = "3.3"
apodize = "1.0"

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
