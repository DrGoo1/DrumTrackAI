[package]
name = "audio-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "audio_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Decoder (mp3, wav, flac, m4a/isomp4)
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "isomp4", "aac"] }
# FFT + STFT for onset/tempo
realfft = "3.3"
rustfft = "6.2"
# Optional speed-up for big files (safe if not available)
rayon = "1.10"
# Base64 for MIDI export
base64 = "0.22"
# Optional PyO3 bindings for Python integration
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

[features]
default = []
python = ["pyo3"]
