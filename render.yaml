services:
  - type: web
    name: drumtrackai-calibration-api
    env: docker
    autoDeploy: true
    dockerfilePath: Dockerfile
    healthCheckPath: /calibration/health
    envVars:
      - key: DB_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
