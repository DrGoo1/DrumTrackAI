services:
  - type: web
    name: drumtrackai-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn llm_service.app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOW_ORIGINS
        value: https://calibrate.example.com
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: DRUMTRACKAI_DB_PATH
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
