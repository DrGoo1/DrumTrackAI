apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-launcher
  namespace: drumtrackai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-launcher
  namespace: drumtrackai
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-launcher
  namespace: drumtrackai
subjects:
  - kind: ServiceAccount
    name: job-launcher
    namespace: drumtrackai
roleRef:
  kind: Role
  name: job-launcher
  apiGroup: rbac.authorization.k8s.io
