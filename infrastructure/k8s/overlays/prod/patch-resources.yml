apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: drumtrackai
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-launcher
  namespace: drumtrackai
spec:
  template:
    spec:
      containers:
        - name: job-launcher
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
