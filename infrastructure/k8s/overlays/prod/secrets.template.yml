apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: drumtrackai
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<set-me>"
  DATABASE_URL: "postgresql://drumtrackai:<set-me>@postgres:5432/drumtrackai"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: drumtrackai
type: Opaque
stringData:
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "<set-me>"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "<set-me>"
