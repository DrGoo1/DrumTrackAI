services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: drumtrackai
      POSTGRES_USER: drumtrackai
      POSTGRES_PASSWORD: drumtrackai
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - drumtrackai-infra
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-01-20T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - drumtrackai-infra
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T02-10-45Z
    depends_on:
      - minio
    volumes:
      - ./minio-lifecycle.json:/minio-lifecycle.json:ro
    networks:
      - drumtrackai-infra
    entrypoint: ["/bin/sh", "-lc"]
    command: >-
      "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb -p local/user-uploads || true;
      mc ilm import local/user-uploads /minio-lifecycle.json;
      echo 'minio init complete';
      "
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    restart: "no"

networks:
  drumtrackai-infra:
    driver: bridge

volumes:
  pg-data:
    driver: local
  minio-data:
    driver: local
